services:
  - type: web
    name: codesentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: CODESENTINEL_ENV
        value: production
      - key: CHECKPOINT_SQLITE
        value: data/codesentinel.sqlite
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
